services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory}
    volumes:
      - inventory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC
      - "3902:3902" # S3 Web
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - inventory-garage-meta:/var/lib/garage/meta
      - inventory-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    depends_on:
      garage:
        condition: service_started

  inventory-api:
    build: ./backend
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD:-inventory}
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-http://localhost:9000/application/o/inventory/}
      OIDC_CLIENT_ID: ${BACKEND_OIDC_CLIENT_ID:-inventory-api}
      OIDC_CLIENT_SECRET: ${BACKEND_OIDC_CLIENT_SECRET:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3333}
      PROXY_ADDRESS_FORWARDING: ${PROXY_ADDRESS_FORWARDING:-false}
      PROXY_ALLOW_FORWARDED: ${PROXY_ALLOW_FORWARDED:-true}
      PROXY_ALLOW_X_FORWARDED: ${PROXY_ALLOW_X_FORWARDED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://openobserver:5080/api/default}
      MEDIA_MODE: ${MEDIA_MODE:-local}
      MEDIA_LOCAL_DIRECTORY: /data/media
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-inventory}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - inventory-media:/data/media

  inventory-app:
    build:
      context: .
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3333:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID-}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:3333/}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email offline_access}
    depends_on:
      inventory-api:
        condition: service_started
    restart: unless-stopped

volumes:
  inventory-postgres:
  inventory-media:
  inventory-garage-meta:
  inventory-garage-data:
