services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-10GB}
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      # Required, never defaulted: compose refuses to start with a missing or empty password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a unique secret (openssl rand -hex 32)}
    ports:
      - "${DB_REPLICATION_BIND_ADDRESS:-127.0.0.1}:${DB_REPLICATION_PORT:-5432}:5432"
    volumes:
      - inventory-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  inventory-api:
    build: ./backend
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a unique secret (openssl rand -hex 32)}
      # The dev profile (QUARKUS_PROFILE=dev) reads the *_DEV datasource; point it at the same database.
      DB_URL_DEV: jdbc:postgresql://postgres:5432/inventory
      DB_USER_DEV: inventory
      DB_PASSWORD_DEV: ${DB_PASSWORD:?Set DB_PASSWORD to a unique secret (openssl rand -hex 32)}
      # Single API node: in-process events and rate limiting. docker-compose.cluster.yml adds Valkey.
      API_RATE_LIMIT_BACKEND: memory
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-300}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      EVENT_BACKEND: memory
      INVENTORY_TIMEZONE: ${INVENTORY_TIMEZONE:-Europe/Berlin}
      INVENTORY_ACCESS_GROUP: ${INVENTORY_ACCESS_GROUP:-inventory}
      INVENTORY_BOOTSTRAP_ADMINS: ${INVENTORY_BOOTSTRAP_ADMINS:-}
      INVENTORY_NOTIFICATION_WEBHOOK_URL: ${INVENTORY_NOTIFICATION_WEBHOOK_URL:-}
      INVENTORY_NOTIFICATION_WEBHOOK_TOKEN: ${INVENTORY_NOTIFICATION_WEBHOOK_TOKEN:-}
      # ntfy push server the API publishes to: HTTPS (e.g. https://ntfy.sh) or an internal container (http://ntfy).
      # The public URL is the subscribe address shown on the profile page (empty: the publish URL).
      # Auth: an access token (tk_...) or username/password; leave empty for open servers.
      INVENTORY_NOTIFICATION_NTFY_URL: ${INVENTORY_NOTIFICATION_NTFY_URL:-}
      INVENTORY_NOTIFICATION_NTFY_PUBLIC_URL: ${INVENTORY_NOTIFICATION_NTFY_PUBLIC_URL:-}
      INVENTORY_NOTIFICATION_NTFY_TOKEN: ${INVENTORY_NOTIFICATION_NTFY_TOKEN:-}
      INVENTORY_NOTIFICATION_NTFY_USERNAME: ${INVENTORY_NOTIFICATION_NTFY_USERNAME:-}
      INVENTORY_NOTIFICATION_NTFY_PASSWORD: ${INVENTORY_NOTIFICATION_NTFY_PASSWORD:-}
      # Admin topics ("none" disables one). Item/assembly actions: created,updated,deleted or none.
      # Changes are collected per interval and posted as one summary per topic and action.
      INVENTORY_NOTIFICATION_NTFY_ITEMS_TOPIC: ${INVENTORY_NOTIFICATION_NTFY_ITEMS_TOPIC:-inventory-items}
      INVENTORY_NOTIFICATION_NTFY_ITEMS_ACTIONS: ${INVENTORY_NOTIFICATION_NTFY_ITEMS_ACTIONS:-created,deleted}
      INVENTORY_NOTIFICATION_NTFY_ASSEMBLIES_TOPIC: ${INVENTORY_NOTIFICATION_NTFY_ASSEMBLIES_TOPIC:-inventory-assemblies}
      INVENTORY_NOTIFICATION_NTFY_ASSEMBLIES_ACTIONS: ${INVENTORY_NOTIFICATION_NTFY_ASSEMBLIES_ACTIONS:-created,deleted}
      INVENTORY_NOTIFICATION_NTFY_USERS_TOPIC: ${INVENTORY_NOTIFICATION_NTFY_USERS_TOPIC:-inventory-users}
      INVENTORY_NOTIFICATION_NTFY_TOPICS_INTERVAL: ${INVENTORY_NOTIFICATION_NTFY_TOPICS_INTERVAL:-60s}
      INVENTORY_PUBLIC_URL: ${INVENTORY_PUBLIC_URL:-http://localhost:5173}
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-http://localhost:9000/application/o/inventory/}
      # A single public Authentik client mirrors the working WRW setup. The
      # BACKEND/VITE-specific variables remain available for advanced setups.
      OIDC_CLIENT_ID: ${BACKEND_OIDC_CLIENT_ID:-${OIDC_CLIENT_ID:-inventory}}
      OIDC_CLIENT_SECRET: ${BACKEND_OIDC_CLIENT_SECRET:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      IMPERSONATION_ENABLED: ${IMPERSONATION_ENABLED:-false}
      OIDC_REQUIRE_INTROSPECTION: ${OIDC_REQUIRE_INTROSPECTION:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3333}
      PROXY_ADDRESS_FORWARDING: ${PROXY_ADDRESS_FORWARDING:-false}
      PROXY_ALLOW_FORWARDED: ${PROXY_ALLOW_FORWARDED:-true}
      PROXY_ALLOW_X_FORWARDED: ${PROXY_ALLOW_X_FORWARDED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://openobserve:5080/api/default}
      OTEL_EXPORTER_OTLP_TOKEN: ${OTEL_EXPORTER_OTLP_TOKEN:-}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-WARN}
      OTEL_LOGS_LEVEL: ${OTEL_LOGS_LEVEL:-INFO}
      OTEL_SERVICE_INSTANCE_ID: ${OTEL_SERVICE_INSTANCE_ID:-}
      OTEL_LOG_STREAM: ${OTEL_LOG_STREAM:-inventory_backend}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15s}
      OTEL_OUTBOX_SNAPSHOT_EVERY: ${OTEL_OUTBOX_SNAPSHOT_EVERY:-30s}
      INVENTORY_LOG_LEVEL: ${INVENTORY_LOG_LEVEL:-INFO}
      INVENTORY_PROCESS_ROLE: ${INVENTORY_PROCESS_ROLE:-all}
      INVENTORY_WORKER_JOBS: ${INVENTORY_WORKER_JOBS:-all}
      REPORT_MAX_SOURCE_ROWS: ${REPORT_MAX_SOURCE_ROWS:-25000}
      REPORT_MAX_OUTPUT_ROWS: ${REPORT_MAX_OUTPUT_ROWS:-25000}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
      APP_VERSION: ${APP_VERSION:-dev}
      MEDIA_MODE: ${MEDIA_MODE:-local}
      MEDIA_LOCAL_DIRECTORY: /data/media
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-inventory}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - inventory-media:/data/media
    # Without a restart policy a crashed API stays down and the reverse proxy answers every request
    # (CORS preflights included) itself, without CORS headers.
    restart: unless-stopped

  inventory-app:
    build:
      context: .
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3333:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-${OIDC_CLIENT_ID:-inventory}}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:3333/}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email offline_access}
      VITE_DEV_LOGIN: ${VITE_DEV_LOGIN:-false}
      VITE_IMPERSONATION: ${VITE_IMPERSONATION:-false}
    depends_on:
      inventory-api:
        condition: service_started
    restart: unless-stopped

volumes:
  inventory-postgres:
  inventory-media:
