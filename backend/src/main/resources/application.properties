%dev.quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.flyway.migrate-at-start=false
%dev.quarkus.observability.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.oidc.enabled=false
%test.inventory.dev-auth.enabled=true
