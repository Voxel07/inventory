quarkus.application.name=ash-inventory-api
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.root-path=/
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3333}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Actor-Id,X-Actor-Name,X-Actor-Role,If-None-Match,Mcp-Session-Id,MCP-Protocol-Version,Last-Event-ID
quarkus.http.cors.exposed-headers=WWW-Authenticate,Retry-After,ETag,Mcp-Session-Id,X-Private-Inventory,X-Filtered-Rows
quarkus.http.proxy.proxy-address-forwarding=${PROXY_ADDRESS_FORWARDING:false}
quarkus.http.proxy.allow-forwarded=${PROXY_ALLOW_FORWARDED:true}
quarkus.http.proxy.allow-x-forwarded=${PROXY_ALLOW_X_FORWARDED:false}
%prod.quarkus.http.proxy.trusted-proxies=${TRUSTED_PROXIES:}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:5}
quarkus.datasource.jdbc.acquisition-timeout=10
# The privacy reference-graph query has a high plan cost; JIT compiling it costs ~4.5 s per request
# while execution takes <100 ms. Short OLTP queries never benefit from JIT.
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c jit=off
# Every profile runs the single canonical V1.0.0__init.sql baseline; Hibernate only validates it.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true
# The OIDC extension enablement is fixed at image build time. Keep the extension
# in the image and use tenant-enabled for the runtime production/dev switch.
quarkus.oidc.enabled=true
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:9000/application/o/inventory/}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:inventory-api}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${quarkus.oidc.client-id}
quarkus.oidc.resource-metadata.enabled=true
quarkus.oidc.roles.role-claim-path=groups
# Accounts are bound to the immutable subject, never to the (renamable) preferred_username/upn.
quarkus.oidc.token.principal-claim=sub
# Revocation bound: by default a revoked/logged-out access token stays valid until its exp, so keep the
# Authentik access-token lifetime short (<= 5 min). OIDC_REQUIRE_INTROSPECTION=true checks every JWT
# against the provider's introspection endpoint (needs BACKEND_OIDC_CLIENT_SECRET); results are cached
# for OIDC_TOKEN_CACHE_TTL, which then becomes the revocation delay.
quarkus.oidc.token.require-jwt-introspection-only=${OIDC_REQUIRE_INTROSPECTION:false}
quarkus.oidc.token-cache.max-size=${OIDC_TOKEN_CACHE_SIZE:1000}
quarkus.oidc.token-cache.time-to-live=${OIDC_TOKEN_CACHE_TTL:60S}
%prod.quarkus.http.auth.permission.api.paths=/api/*
%prod.quarkus.http.auth.permission.api.policy=authenticated
%prod.quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
%prod.quarkus.http.auth.permission.mcp.policy=authenticated
quarkus.smallrye-openapi.info-title=ASH Inventory API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.otel.enabled=${OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:5080/api/default}
quarkus.otel.resource.attributes=service.name=ash-inventory-api
# Header-based development identities. ProductionAuthGuard refuses to start the prod profile with this enabled.
inventory.dev-auth.enabled=${DEV_AUTH_ENABLED:false}
%dev.inventory.dev-auth.enabled=${DEV_AUTH_ENABLED:true}
# Calendar dates (due dates, availability windows, reports) use this zone, not the JVM default.
inventory.timezone=${INVENTORY_TIMEZONE:Europe/Berlin}
inventory.api.rate-limit.requests=${API_RATE_LIMIT_REQUESTS:300}
inventory.api.rate-limit.window-seconds=${API_RATE_LIMIT_WINDOW_SECONDS:60}
inventory.api.rate-limit.backend=${API_RATE_LIMIT_BACKEND:memory}
inventory.events.backend=${EVENT_BACKEND:memory}
# Fallback poll; commits on this node wake the dispatcher immediately.
inventory.events.outbox.dispatch-every=${EVENT_OUTBOX_DISPATCH_EVERY:5s}
inventory.events.outbox.retention=${EVENT_OUTBOX_RETENTION:P30D}
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
# Single-node deployments run without Valkey; the cluster compose enables the readiness check.
quarkus.redis.health.enabled=${REDIS_HEALTH_ENABLED:false}
%test.quarkus.redis.devservices.enabled=false
%dev.quarkus.redis.devservices.enabled=false

# Reference data is cached in process (Caffeine) under commit-ordered revision keys, so replicas
# never need a cache invalidation message. Valkey is only the cluster's event bus and rate limiter.
quarkus.cache.caffeine."factions-cache".expire-after-write=300s

inventory.media.mode=${MEDIA_MODE:local}
# Uploads: sniffed WebP/PNG/JPEG/PDF only, per-file limit, per-user pending-upload quota, abandoned uploads purged.
quarkus.http.limits.max-body-size=${API_MAX_BODY_SIZE:11M}
inventory.media.max-upload-bytes=${MEDIA_MAX_UPLOAD_BYTES:10485760}
inventory.media.max-staged-per-user=${MEDIA_MAX_STAGED_PER_USER:50}
inventory.media.staged-max-age=${MEDIA_STAGED_MAX_AGE:PT24H}
inventory.media.local-directory=${MEDIA_LOCAL_DIRECTORY:./data/media}
inventory.media.s3.endpoint=${S3_ENDPOINT:http://localhost:3900}
inventory.media.s3.bucket=${S3_BUCKET:inventory}
inventory.media.s3.region=${S3_REGION:garage}
inventory.media.s3.access-key=${S3_ACCESS_KEY:}
inventory.media.s3.secret-key=${S3_SECRET_KEY:}
quarkus.s3.devservices.enabled=false
%dev.quarkus.observability.enabled=false
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=${TEST_DB_USER:}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD:}
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:}
# Tests recreate the disposable TEST_DB_URL database from the baseline on every start.
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.inventory.dev-auth.enabled=true
quarkus.hibernate-orm.query.fail-on-pagination-over-collection-fetch=true

# Model Context Protocol (MCP) Server
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.server-info.name=ash-inventory-mcp
quarkus.mcp.server.server-info.title=ASH Inventory MCP Server
quarkus.mcp.server.server-info.version=1.0.0
quarkus.mcp.server.server-info.description=Model Context Protocol server for the ASH Event-Driven Inventory Management System
quarkus.mcp.server.traffic-logging.enabled=false
%dev.quarkus.mcp.server.traffic-logging.enabled=true
quarkus.cache.caffeine."factions-cache".maximum-size=64
