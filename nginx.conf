server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Generated by docker-entrypoint.sh: CSP connect-src is limited to the configured API and OIDC origins.
    # nginx drops inherited add_header directives in any location that sets its own, so every such
    # location includes the snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
