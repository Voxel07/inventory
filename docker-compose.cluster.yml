# ASH Inventory - Multi-VPS Scaled Architecture (2+ App Replicas + Shared Valkey + PostgreSQL + Garage S3)
# Usage:
#   docker compose -f docker-compose.cluster.yml up -d
# For deployment across distinct VPS nodes, run App services on VPS 1 & 2 pointing to:
#   - DB_URL: Primary PostgreSQL on VPS 1 (with a logical replica on the storage VPS)
#   - REDIS_URL: Shared Valkey (Redis protocol) for distributed rate limiting and
#     live-event fan-out (caches are per node, keyed by committed database revisions)
#   - S3_ENDPOINT: Garage S3 cluster node on VPS 3

# Shared definition of every API node; each node below adds only its port and instance id.
x-inventory-api: &inventory-api
  build: ./backend
  environment: &inventory-api-environment
    QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
    DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/inventory}
    DB_USER: inventory
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a unique secret (openssl rand -hex 32)}
    REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
    API_RATE_LIMIT_BACKEND: redis
    EVENT_BACKEND: redis
    REDIS_HEALTH_ENABLED: "true"
    INVENTORY_TIMEZONE: ${INVENTORY_TIMEZONE:-Europe/Berlin}
    INVENTORY_ACCESS_GROUP: ${INVENTORY_ACCESS_GROUP:-inventory}
    INVENTORY_BOOTSTRAP_ADMINS: ${INVENTORY_BOOTSTRAP_ADMINS:-}
    OIDC_REQUIRE_INTROSPECTION: ${OIDC_REQUIRE_INTROSPECTION:-false}
    API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-300}
    API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
    OIDC_ENABLED: ${OIDC_ENABLED:-true}
    OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-http://localhost:9000/application/o/inventory/}
    OIDC_CLIENT_ID: ${BACKEND_OIDC_CLIENT_ID:-${OIDC_CLIENT_ID:-inventory}}
    OIDC_CLIENT_SECRET: ${BACKEND_OIDC_CLIENT_SECRET:-}
    DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3333}
    PROXY_ADDRESS_FORWARDING: ${PROXY_ADDRESS_FORWARDING:-false}
    PROXY_ALLOW_FORWARDED: ${PROXY_ALLOW_FORWARDED:-true}
    PROXY_ALLOW_X_FORWARDED: ${PROXY_ALLOW_X_FORWARDED:-false}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://openobserve:5080/api/default}
    OTEL_EXPORTER_OTLP_TOKEN: ${OTEL_EXPORTER_OTLP_TOKEN:-}
    OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-WARN}
    OTEL_LOGS_LEVEL: ${OTEL_LOGS_LEVEL:-INFO}
    OTEL_LOG_STREAM: ${OTEL_LOG_STREAM:-inventory_backend}
    OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15s}
    OTEL_OUTBOX_SNAPSHOT_EVERY: ${OTEL_OUTBOX_SNAPSHOT_EVERY:-30s}
    INVENTORY_LOG_LEVEL: ${INVENTORY_LOG_LEVEL:-INFO}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    INVENTORY_NOTIFICATION_WEBHOOK_URL: ${INVENTORY_NOTIFICATION_WEBHOOK_URL:-}
    INVENTORY_NOTIFICATION_WEBHOOK_TOKEN: ${INVENTORY_NOTIFICATION_WEBHOOK_TOKEN:-}
    INVENTORY_PUBLIC_URL: ${INVENTORY_PUBLIC_URL:-http://localhost:3333}
    REPORT_MAX_SOURCE_ROWS: ${REPORT_MAX_SOURCE_ROWS:-25000}
    REPORT_MAX_OUTPUT_ROWS: ${REPORT_MAX_OUTPUT_ROWS:-25000}
    DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    APP_VERSION: ${APP_VERSION:-dev}
    MEDIA_MODE: s3
    S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
    S3_BUCKET: ${S3_BUCKET:-inventory}
    S3_REGION: ${S3_REGION:-garage}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    garage:
      condition: service_started
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/q/health/live || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 5
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-10GB}
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      # Required, never defaulted: compose refuses to start with a missing or empty password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a unique secret (openssl rand -hex 32)}
    ports:
      # Private/VPN address only: the second API node and the storage replica connect here.
      - "${DB_REPLICATION_BIND_ADDRESS:-127.0.0.1}:${DB_REPLICATION_PORT:-5432}:5432"
    volumes:
      - inventory-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      # Valkey has no password here: bind only to loopback or a firewalled private address.
      - "${VALKEY_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - inventory-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_BIND_ADDRESS:-0.0.0.0}:3900:3900" # S3 API
      - "${GARAGE_RPC_BIND_ADDRESS:-127.0.0.1}:3901:3901" # RPC: bind to the private peer network when clustering
      - "${GARAGE_WEB_BIND_ADDRESS:-0.0.0.0}:3902:3902" # S3 Web
      - "${GARAGE_ADMIN_BIND_ADDRESS:-127.0.0.1}:3903:3903" # Admin API: management interface only
    environment:
      # Secrets come from the environment; compose refuses to start without them (no placeholder credentials).
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN (openssl rand -hex 32)}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - inventory-garage-meta:/var/lib/garage/meta
      - inventory-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Primary API Node (VPS 1 / Replica 1)
  inventory-api-1:
    <<: *inventory-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *inventory-api-environment
      INVENTORY_PROCESS_ROLE: api
      OTEL_SERVICE_INSTANCE_ID: ${OTEL_SERVICE_INSTANCE_ID_1:-}

  # Secondary API Node (VPS 2 / Replica 2 for Load Balancing)
  inventory-api-2:
    <<: *inventory-api
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *inventory-api-environment
      INVENTORY_PROCESS_ROLE: api
      OTEL_SERVICE_INSTANCE_ID: ${OTEL_SERVICE_INSTANCE_ID_2:-}

  # Shared operational jobs; add replicas only after budgeting total database connections.
  inventory-worker:
    <<: *inventory-api
    environment:
      <<: *inventory-api-environment
      INVENTORY_PROCESS_ROLE: worker
      INVENTORY_WORKER_JOBS: outbox,reminders,digests,media,retention,sessions
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-3}

  # Independently scalable delivery pool. No application HTTP port is published.
  inventory-notifications:
    <<: *inventory-api
    environment:
      <<: *inventory-api-environment
      INVENTORY_PROCESS_ROLE: worker
      INVENTORY_WORKER_JOBS: notifications
      DB_POOL_SIZE: ${NOTIFICATION_DB_POOL_SIZE:-2}

  # Report source work is bounded; this pool can scale separately from HTTP.
  inventory-reports:
    <<: *inventory-api
    environment:
      <<: *inventory-api-environment
      INVENTORY_PROCESS_ROLE: worker
      INVENTORY_WORKER_JOBS: reports
      DB_POOL_SIZE: ${REPORT_DB_POOL_SIZE:-2}

  # Static Web Frontend
  inventory-app:
    build:
      context: .
      args:
        - APP_VERSION=${APP_VERSION:-cluster}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3333:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-${OIDC_CLIENT_ID:-inventory}}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:3333/}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email offline_access}
    depends_on:
      inventory-api-1:
        condition: service_started
    restart: unless-stopped

volumes:
  inventory-postgres:
  inventory-valkey:
  inventory-garage-meta:
  inventory-garage-data:
