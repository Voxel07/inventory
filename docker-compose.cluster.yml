# ASH Inventory - Multi-VPS Scaled Architecture (2+ App Replicas + Shared Valkey + PostgreSQL + Garage S3)
# Usage:
#   docker compose -f docker-compose.cluster.yml up -d
# For deployment across distinct VPS nodes, run App services on VPS 1 & 2 pointing to:
#   - DB_URL: Primary PostgreSQL on VPS 1 (with read replica on VPS 2)
#   - REDIS_URL: Shared Valkey (Redis protocol) for the catalog cache,
#     distributed rate limiting, and live-event fan-out
#   - S3_ENDPOINT: Garage S3 cluster node on VPS 3

services:
  postgres:
    image: postgres:18-alpine
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory}
    volumes:
      - inventory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - inventory-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC
      - "3902:3902" # S3 Web
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - inventory-garage-meta:/var/lib/garage/meta
      - inventory-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Primary API Node (VPS 1 / Replica 1)
  inventory-api-1:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD:-inventory}
      REDIS_URL: redis://valkey:6379
      API_RATE_LIMIT_BACKEND: redis
      EVENT_BACKEND: redis
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-300}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-http://localhost:9000/application/o/inventory/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-inventory}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3333}
      MEDIA_MODE: s3
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-inventory}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/q/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Secondary API Node (VPS 2 / Replica 2 for Load Balancing)
  inventory-api-2:
    build: ./backend
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      QUARKUS_PROFILE: ${QUARKUS_PROFILE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD:-inventory}
      REDIS_URL: redis://valkey:6379
      API_RATE_LIMIT_BACKEND: redis
      EVENT_BACKEND: redis
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-300}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-http://localhost:9000/application/o/inventory/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-inventory}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3333}
      MEDIA_MODE: s3
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-inventory}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/q/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Static Web Frontend
  inventory-app:
    build:
      context: .
      args:
        - APP_VERSION=${APP_VERSION:-cluster}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3333:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-inventory}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:3333/}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email offline_access}
    depends_on:
      inventory-api-1:
        condition: service_started
    restart: unless-stopped

volumes:
  inventory-postgres:
  inventory-valkey:
  inventory-garage-meta:
  inventory-garage-data:
