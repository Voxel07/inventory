# Run this file on the dedicated storage/S3 VPS. It keeps Garage and a clean
# PostgreSQL 18 database for logical replication in a separate failure domain.
services:
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_BIND_ADDRESS:-0.0.0.0}:3900:3900"
      - "${GARAGE_RPC_BIND_ADDRESS:-0.0.0.0}:3901:3901"
      - "${GARAGE_WEB_BIND_ADDRESS:-0.0.0.0}:3902:3902"
      - "${GARAGE_ADMIN_BIND_ADDRESS:-127.0.0.1}:3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - inventory-garage-meta:/var/lib/garage/meta
      - inventory-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-webui:
    image: khairul169/garage-webui:latest
    restart: unless-stopped
    ports:
      - "${GARAGE_WEBUI_BIND_ADDRESS:-127.0.0.1}:3909:3909"
    environment:
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    depends_on:
      garage:
        condition: service_started

  postgres-replica:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${REPLICA_DB_PASSWORD:?Set REPLICA_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "${REPLICA_DB_BIND_ADDRESS:-127.0.0.1}:${REPLICA_DB_PORT:-5433}:5432"
    volumes:
      - inventory-postgres-replica:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  inventory-garage-meta:
  inventory-garage-data:
  inventory-postgres-replica:
