# Single-node media storage: docker compose -f docker-compose.yml -f docker-compose.garage.yml up -d
# Garage refuses to start without real secrets; admin API and WebUI bind to loopback (use an SSH tunnel).
services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_BIND_ADDRESS:-0.0.0.0}:3900:3900" # S3 API
      - "${GARAGE_RPC_BIND_ADDRESS:-127.0.0.1}:3901:3901" # RPC (single node: no peers)
      - "${GARAGE_WEB_BIND_ADDRESS:-0.0.0.0}:3902:3902" # S3 Web
      - "${GARAGE_ADMIN_BIND_ADDRESS:-127.0.0.1}:3903:3903" # Admin API: management interface only
    environment:
      # Secrets come from the environment; compose refuses to start without them (no placeholder credentials).
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN (openssl rand -hex 32)}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - inventory-garage-meta:/var/lib/garage/meta
      - inventory-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    ports:
      - "${GARAGE_WEBUI_BIND_ADDRESS:-127.0.0.1}:3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN (openssl rand -hex 32)}
      # user:bcrypt-hash, e.g. htpasswd -nbBC 10 admin <password>
      AUTH_USER_PASS: ${GARAGE_WEBUI_AUTH:?Set GARAGE_WEBUI_AUTH for the Garage WebUI login}
    depends_on:
      garage:
        condition: service_started

volumes:
  inventory-garage-meta:
  inventory-garage-data:
